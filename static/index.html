<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quorum — trip agent prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f3efe6; --panel:#fff; --ink:#222; --muted:#6b6b6b; --line:#ddd6c8; --red:#9b1c1c; --teal:#1f7a8c; --green:#2e7d32; --gold:#b8860b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px; background:var(--red); color:#fff; }
  header h1 { font-size:17px; margin:0; font-weight:700; }
  header .state { font-size:12px; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:12px; }
  header .clock { margin-left:auto; font-size:12px; display:flex; gap:6px; align-items:center; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--red); color:#fff; border-color:var(--red); }
  button:disabled { opacity:.45; cursor:default; }
  main { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap:12px; padding:12px 18px; height:calc(100vh - 48px); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  .scroll { overflow:auto; padding:12px 14px; flex:1; }
  .msg { max-width:92%; margin:0 0 10px; padding:8px 11px; border-radius:10px; white-space:pre-wrap; background:#f7f4ec; border:1px solid #ece6d8; }
  .msg.agent { background:#e4f1f4; border-color:#cfe3e8; }
  .msg.system { background:transparent; border:none; color:var(--muted); font-size:12px; padding:2px 0; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .tabs { display:flex; gap:4px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .actions { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .kv b { color:var(--muted); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid #eee7d9; vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .PENDING { color:var(--gold); } .BLOCKED { color:var(--teal); } .CAPTURED { color:var(--green); } .RELEASED, .EXPIRED { color:var(--red); }
  .rail { font-family: ui-monospace, Menlo, monospace; font-size:11.5px; padding:4px 0; border-bottom:1px dashed #eee7d9; }
  .rail .tag { display:inline-block; width:74px; font-weight:700; }
  .rail.payments .tag { color:var(--red); } .rail.voice .tag { color:var(--teal); } .rail.logistics .tag { color:#5b6b7a; }
  .default { color:var(--green); font-weight:700; }
  small { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Quorum</h1>
  <span class="state" id="state">no trip yet</span>
  <span id="subtitle" style="font-size:12px;opacity:.85">the organiser never fronts money, never chases</span>
  <div class="clock">
    <span id="now">—</span>
    <button onclick="advance(6)">+6h</button>
    <button onclick="advance(24)">+24h</button>
    <button onclick="advance(48)">+48h</button>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Group chat · <span id="gname">—</span></h2>
    <div class="scroll" id="group"></div>
    <div class="actions" id="groupActions">
      <button class="primary" onclick="trigger()">Organiser adds Quorum to the group</button>
    </div>
  </section>

  <section class="panel">
    <h2>Private DMs</h2>
    <div class="tabs" id="tabs"></div>
    <div class="scroll" id="dm"></div>
    <div class="actions" id="dmActions"></div>
  </section>

  <section class="panel">
    <h2>Rails</h2>
    <div class="kv" id="kv"></div>
    <div class="scroll">
      <div id="bundles"></div>
      <div id="auths" style="margin-top:10px"></div>
      <div id="rails" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<script>
let trip = null, current = null;
const $ = id => document.getElementById(id);
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const first = n => n.split(' ')[0];
const fmt = iso => new Date(iso).toLocaleString('en-IN', {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});

async function api(path, method='GET', body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { alert((await r.json()).detail || r.statusText); throw new Error(r.statusText); }
  return r.json();
}
async function trigger() { trip = await api('/trips', 'POST', {}); current = trip.members[0].id; render(); }
async function reload() { if (trip) { trip = await api('/trips/' + trip.id); render(); } }
async function advance(h) { await api('/clock/advance', 'POST', {hours:h}); await reload(); if (!trip) $('now').textContent = fmt((await api('/clock')).now); }

// canned replies, one per member, so the demo is one click per person
const canned = {
  'Sayan':  {available:true,  budget_ceiling:20000, must_haves:['no hostels'], text:'Yes to dates. ₹20k is my ceiling. No hostels please.'},
  'Aabhas': {available:true,  budget_ceiling:22000, must_haves:[], text:'In. ₹22k. Anything with a beach.'},
  'Aditi':  {available:true,  budget_ceiling:18000, must_haves:['no hostels'], text:'Yes. ₹18k max, and not a hostel.'},
  'Riya':   {available:true,  budget_ceiling:20000, must_haves:[], text:'Dates work. ₹20k. Nothing fancy.'},
  'Karan':  {available:true,  budget_ceiling:15000, must_haves:[], text:'ok. 15k.'},
};
async function reply(mid) { const m = trip.members.find(x=>x.id===mid); trip = await api(`/trips/${trip.id}/members/${mid}/capture`, 'POST', canned[first(m.name)]); render(); }
async function approve(mid) { trip = await api(`/trips/${trip.id}/members/${mid}/approve`, 'POST'); render(); }
async function switchDefault(bid) { trip = await api(`/trips/${trip.id}/switch-default`, 'POST', {bundle_id: bid}); render(); }
async function rerun(bid) { trip = await api(`/trips/${trip.id}/rerun`, 'POST', {bundle_id: bid}); render(); }
async function closeTrip() { trip = await api(`/trips/${trip.id}/close`, 'POST'); render(); }
async function disrupt(legId) { trip = await api(`/trips/${trip.id}/disrupt/${legId}`, 'POST'); render(); }

function msgHtml(e) {
  const cls = e.actor === 'agent' ? 'agent' : (e.actor === 'system' ? 'system' : '');
  const who = cls === 'system' ? '' : `<div class="who">${e.actor} · ${fmt(e.at)}</div>`;
  return `<div class="msg ${cls}">${who}${e.text}</div>`;
}

function render() {
  if (!trip) return;
  $('state').textContent = trip.state;
  $('now').textContent = fmt(trip.now);
  $('gname').textContent = trip.name;
  // group
  $('group').innerHTML = trip.events.filter(e => e.channel === 'group' || e.channel === 'system').map(msgHtml).join('');
  $('group').scrollTop = 1e9;
  const ga = $('groupActions'); ga.innerHTML = '';
  if (trip.state === 'POSTED') trip.bundles.filter(b=>!b.is_default).forEach(b => ga.innerHTML += `<button onclick="switchDefault('${b.id}')">Group says: make ${b.label} the default</button>`);
  if (trip.state === 'LAPSED') { trip.bundles.forEach(b => ga.innerHTML += `<button onclick="rerun('${b.id}')">Re-run with ${b.label}</button>`); ga.innerHTML += `<button onclick="closeTrip()">Close trip</button>`; }
  if (trip.state === 'BOOKED') {
    const b = trip.bundles.find(x=>x.id===trip.default_bundle_id);
    const leg = b.legs.find(l => l.status === 'BOOKED');
    if (leg) ga.innerHTML += `<button onclick="disrupt('${leg.id}')">Simulate: carrier cancels ${first(trip.members.find(m=>m.id===leg.member_id).name)}'s ${leg.origin}→${leg.destination}</button>`;
  }
  // DMs
  $('tabs').innerHTML = trip.members.map(m => `<button class="${m.id===current?'on':''}" onclick="current='${m.id}';render()">${first(m.name)}${m.id===trip.organiser_id?' ★':''}</button>`).join('');
  $('dm').innerHTML = trip.events.filter(e => e.channel === 'dm:' + current).map(msgHtml).join('') || '<small>nothing yet</small>';
  $('dm').scrollTop = 1e9;
  const m = trip.members.find(x=>x.id===current); const da = $('dmActions'); da.innerHTML = '';
  if (trip.state === 'CAPTURING' && !trip.constraints[current]) da.innerHTML += `<button class="primary" onclick="reply('${current}')">${first(m.name)} replies with constraints</button>`;
  if (trip.state === 'POSTED') { const a = trip.authorisations[current]; if (a && a.status === 'PENDING') da.innerHTML += `<button class="primary" onclick="approve('${current}')">${first(m.name)} approves UPI block (${inr(a.amount)})</button>`; }
  // rails panel
  const org = trip.members.find(x=>x.id===trip.organiser_id);
  $('kv').innerHTML = `<b>Organiser</b><span>${org.name} (never pays for anyone)</span>
    <b>Quorum</b><span>${trip.blocked_count} blocked of ${trip.quorum} needed, ${trip.members.length} members</span>
    <b>Deadline</b><span>${trip.deadline ? fmt(trip.deadline) : (trip.capture_deadline ? 'replies by ' + fmt(trip.capture_deadline) : '—')}</span>`;
  $('bundles').innerHTML = trip.bundles.length ? `<table><tr><th>Bundle</th><th>Stay</th><th>Verified</th>${trip.members.map(x=>'<th>'+first(x.name)+'</th>').join('')}</tr>` +
    trip.bundles.map(b => `<tr><td class="${b.is_default?'default':''}">${b.label}${b.is_default?' ·default':''}</td><td>${b.stay.name}<br><small>${b.stay.nights} nights · ${b.stay.booking_ref||''}</small></td><td>${b.stay.verification ? b.stay.verification.disposition : '—'}</td>${trip.members.map(x=>'<td>'+inr(trip.per_head[b.id][x.id])+'</td>').join('')}</tr>`).join('') + '</table>' : '<small>no bundles yet</small>';
  const auths = Object.values(trip.authorisations);
  $('auths').innerHTML = auths.length ? `<table><tr><th>Member</th><th>Share</th><th>Mandate</th><th>Status</th></tr>` +
    auths.map(a => `<tr><td>${first(trip.members.find(x=>x.id===a.member_id).name)}</td><td>${inr(a.amount)}</td><td><small>${a.rail_ref}</small></td><td><span class="pill ${a.status}">${a.status}</span></td></tr>`).join('') + '</table>' : '';
  $('rails').innerHTML = trip.events.filter(e => e.channel.startsWith('rail:')).map(e => `<div class="rail ${e.actor}"><span class="tag">${e.actor}</span>${e.text}</div>`).join('');
}
api('/clock').then(c => $('now').textContent = fmt(c.now));
</script>
</body>
</html>
