<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quorum — trip agent prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f3efe6; --panel:#fff; --ink:#222; --muted:#6b6b6b; --line:#ddd6c8; --red:#9b1c1c; --teal:#1f7a8c; --green:#2e7d32; --gold:#b8860b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--red); color:#fff; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:700; }
  header .state { font-size:12px; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:12px; }
  header .clock { margin-left:auto; font-size:12px; display:flex; gap:6px; align-items:center; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--red); color:#fff; border-color:var(--red); }
  button.quiet { color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }
  input, select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; width:90px; }
  main { display:grid; grid-template-columns: 1.1fr 1fr 1.1fr; gap:12px; padding:12px 18px; height:calc(100vh - 48px); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  .scroll { overflow:auto; padding:12px 14px; flex:1; }
  .msg { max-width:92%; margin:0 0 10px; padding:8px 11px; border-radius:10px; white-space:pre-wrap; background:#f7f4ec; border:1px solid #ece6d8; }
  .msg.agent { background:#e4f1f4; border-color:#cfe3e8; }
  .msg.system { background:transparent; border:none; color:var(--muted); font-size:12px; padding:2px 0; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .tabs { display:flex; gap:4px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .actions { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .kv b { color:var(--muted); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid #eee7d9; vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .PENDING { color:var(--gold); } .BLOCKED { color:var(--teal); } .CAPTURED { color:var(--green); } .RELEASED, .EXPIRED, .REVOKED, .REFUNDED { color:var(--red); }
  .rail { font-family: ui-monospace, Menlo, monospace; font-size:11.5px; padding:4px 0; border-bottom:1px dashed #eee7d9; }
  .rail .tag { display:inline-block; width:74px; font-weight:700; }
  .rail.payments .tag { color:var(--red); } .rail.voice .tag { color:var(--teal); } .rail.logistics .tag { color:#5b6b7a; }
  .current { color:var(--green); font-weight:700; }
  .p0 { background:var(--teal); color:#fff; border-color:var(--teal); margin-right:6px; }
  .h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 4px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Quorum</h1>
  <span class="state" id="state">no trip yet</span>
  <span style="font-size:12px;opacity:.85">the organiser never fronts money, never chases</span>
  <div class="clock">
    <span id="now">—</span>
    <button onclick="advance(0.5)">+30 min</button>
    <button onclick="advance(12)">+12h</button>
    <button onclick="advance(24)">+24h</button>
    <button onclick="advance(48)">+48h</button>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Group chat · <span id="gname">—</span></h2>
    <div class="scroll" id="group"></div>
    <div class="actions" id="groupActions">
      <select id="scenario"><option value="wedding">wedding · Assagao</option><option value="leisure">leisure</option></select>
      <label><small>₹/head</small> <input id="budget" type="number" value="20000" step="500"></label>
      <label><small>over %</small> <input id="overshoot" type="number" value="10" step="5" style="width:60px"></label>
      <button class="primary" onclick="trigger()">Organiser adds Quorum to the group</button>
    </div>
  </section>

  <section class="panel">
    <h2>Private DMs · what each member sees, and only they see</h2>
    <div class="tabs" id="tabs"></div>
    <div class="scroll" id="dm"></div>
    <div class="actions" id="dmActions"></div>
  </section>

  <section class="panel">
    <h2>Rails · what the agent knows</h2>
    <div class="kv" id="kv"></div>
    <div class="scroll">
      <div id="plans"></div>
      <div id="votes"></div>
      <div id="auths"></div>
      <div id="knobs"></div>
      <div class="h3">Rail log</div>
      <div id="rails"></div>
    </div>
  </section>
</main>

<script>
let trip = null, current = null;
const $ = id => document.getElementById(id);
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const fmt = iso => new Date(iso).toLocaleString('en-IN', {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const member = id => trip.members.find(m => m.id === id);
const first = m => m.name.split(' ')[0];
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function api(path, method='GET', body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { alert((await r.json()).detail || r.statusText); throw new Error(r.statusText); }
  return r.json();
}
async function act(path, body) { trip = await api(path, 'POST', body); render(); }
async function trigger() {
  trip = await api('/trips', 'POST', {scenario: $('scenario').value, budget: +$('budget').value, overshoot: +$('overshoot').value / 100});
  current = trip.members[0].id; render();
}
async function reload() { if (trip) { trip = await api('/trips/' + trip.id); render(); } }
async function advance(h) { await api('/clock/advance', 'POST', {hours:h}); await reload(); if (!trip) $('now').textContent = fmt((await api('/clock')).now); }
async function knob(path, body) { await api(path, 'POST', body); await reload(); }

const m = (path, body) => act(`/trips/${trip.id}/members/${current}/${path}`, body);
const t = (path, body) => act(`/trips/${trip.id}/${path}`, body);

function msgHtml(e) {
  const cls = e.actor === 'agent' ? 'agent' : (e.actor === 'system' ? 'system' : '');
  const who = cls === 'system' ? '' : `<div class="who">${esc(e.actor)} · ${fmt(e.at)}</div>`;
  return `<div class="msg ${cls}">${who}${esc(e.text)}</div>`;
}
const btn = (label, onclick, cls='') => `<button class="${cls}" onclick="${onclick}">${label}</button>`;

function render() {
  if (!trip) return;
  const plan = trip.plans[trip.plans.length - 1];
  const org = member(trip.organiser_id);
  $('state').textContent = trip.state + (trip.awaiting_organiser ? ' · waiting on ' + first(org) : '');
  $('now').textContent = fmt(trip.now);
  $('gname').textContent = trip.name;

  // ---- group chat: kickoff, tally, booking, disruptions. Nothing else.
  $('group').innerHTML = trip.events.filter(e => e.channel === 'group' || e.channel === 'system').map(msgHtml).join('');
  $('group').scrollTop = 1e9;
  const ga = []; 
  if (trip.awaiting_organiser === 'no_fit') {
    ga.push(btn(`${first(org)}: raise budget to ${inr(trip.budget + 2000)}`, `t('organiser/adjust', {budget: ${trip.budget + 2000}})`, 'primary'));
    ga.push(btn(`${first(org)}: allow 20% over`, `t('organiser/adjust', {overshoot: 0.2})`));
  }
  if (trip.awaiting_organiser === 'vote_failed') {
    ga.push(btn(`${first(org)}: go with the yes-voters`, `t('organiser/decide', {go: true})`, 'primary'));
    ga.push(btn(`${first(org)}: close the trip`, `t('organiser/decide', {go: false})`));
  }
  if (trip.state === 'LAPSED') {
    if (trip.in_members.length) ga.push(btn('Re-run the authorisation', `t('rerun')`, 'primary'));
    ga.push(btn('Close trip', `t('close')`));
  }
  if (trip.state === 'BOOKED' && plan) {
    plan.legs.filter(l => l.status === 'BOOKED' && l.destination === trip.destination).forEach(l =>
      ga.push(btn(`Carrier cancels ${first(member(l.member_id))}'s ${l.origin}→${l.destination}`, `t('disrupt/${l.id}')`)));
  }
  ga.push(btn('New trip', 'location.reload()', 'quiet'));
  $('groupActions').innerHTML = (ga.length > 1 ? '' : '<small>the group hears from the agent only at kickoff, the tally, the booking and a disruption &nbsp;</small>') + ga.join('');

  // ---- DMs
  $('tabs').innerHTML = trip.members.map(x => { const c = trip.constraints[x.id]; return `<button class="${x.id===current?'on':''}" onclick="current='${x.id}';render()">${first(x)}${c && c.party > 1 ? ' +' + (c.party - 1) : ''}${x.id===trip.organiser_id?' ★':''}${trip.in_members.includes(x.id)?' ✓':''}</button>`; }).join('');
  $('dm').innerHTML = trip.events.filter(e => e.channel === 'dm:' + current).map(msgHtml).join('') || '<small>nothing yet</small>';
  $('dm').scrollTop = 1e9;
  const me = member(current), da = [];
  const auth = trip.authorisations[current], top = trip.top_ups[current], pend = trip.pending[current];
  if (trip.state === 'GATHERING' && !trip.constraints[current]) da.push(btn(`${first(me)} replies: start city, return city, must-haves`, `m('gather', {canned: true})`, 'primary'));
  if (trip.state === 'VOTING' && plan.travellers.includes(current) && !trip.votes[current]) {
    da.push(btn('Yes', `m('vote', {yes: true})`, 'primary'));
    da.push(btn('No — too expensive', `m('vote', {yes: false, reason: 'Too expensive for me. Cheaper?'})`));
    da.push(btn('No — other reason', `m('vote', {yes: false, reason: 'Those dates do not work for me.'})`));
  }
  if (trip.state === 'AUTHORISING' && auth && auth.status === 'PENDING') {
    const emi = (trip.emi_offers[current] || [])[0];
    da.push(btn(`Approve UPI block ${inr(auth.amount)}`, `m('approve', {via: 'UPI_RESERVE'})`, 'primary'));
    da.push(btn(`Hold ${inr(auth.amount)} on credit card`, `m('approve', {via: 'CARD_PREAUTH'})`));
    if (emi) da.push(btn(`Card, ${emi[0]}-month EMI (${inr(emi[1])}/mo)`, `m('approve', {via: 'CARD_PREAUTH', emi_months: ${emi[0]}})`));
    da.push(btn(`Pay ${inr(auth.amount)} now via link`, `m('approve', {via: 'PREPAID'})`, 'quiet'));
  }
  if (trip.state === 'AUTHORISING' && auth && auth.status === 'BLOCKED') da.push(btn('Ask Quorum to release my block', `m('withdraw')`, 'quiet'));
  if (top && top.status === 'PENDING') da.push(btn(`Approve top-up ${inr(top.amount)}${auth && auth.instrument === 'CARD_PREAUTH' ? ' (card tap)' : ''}`, `m('approve', {via: '${auth && auth.instrument ? auth.instrument : 'UPI_RESERVE'}'})`, 'primary'));
  if (pend && pend.kind === 'REBOOK' && pend.choice == null) pend.options.forEach((o, i) => da.push(btn(`Option ${i+1}: ${o.carrier} ${o.depart.slice(11,16)} ${inr(o.price)}`, `m('choose', {option: ${i+1}})`)));
  if (trip.state === 'BOOKED' && plan.travellers.includes(current)) da.push(btn(`${first(me)} drops out`, `m('exit')`, 'quiet'));
  $('dmActions').innerHTML = da.join('') || `<small>${first(me)} has nothing to do right now</small>`;

  // ---- rails
  const deadline = trip.state === 'GATHERING' ? trip.gather_deadline : trip.state === 'VOTING' ? trip.vote_deadline : trip.state === 'AUTHORISING' ? trip.auth_deadline : null;
  $('kv').innerHTML = `<b>Organiser</b><span>${esc(org.name)} — never pays for anyone</span>
    <b>Occasion</b><span>${trip.occasion} · ${trip.destination}${trip.venue ? ' · venue ' + trip.venue : ''} · ${trip.start} → ${trip.end}</span>
    <b>Budget</b><span>proposal built to ${inr(trip.budget)} a head +${Math.round(trip.overshoot*100)}% = ${inr(trip.limit)}${trip.total_budget ? ` · set by the ${trip.in_members.length} payers who are in (${plan ? trip.heads[plan.id] : '?'} heads): ${plan ? trip.heads[plan.id] : '?'} × ${inr(trip.budget_floor)} (lowest ceiling) = <b style="color:var(--ink)">${inr(trip.total_budget)}</b>` : ' · after the vote: heads of the yes-voters × their lowest ceiling'}</span>
    <b>Pool</b><span>${inr(trip.pool)} in Quorum's account · ${trip.payouts.length} payout${trip.payouts.length===1?'':'s'} to suppliers · the organiser is never in the money path</span>
    <b>Deadline</b><span>${deadline ? fmt(deadline) : '—'}</span>
    <b>In</b><span>${trip.in_members.length ? trip.in_members.map(id => first(member(id))).join(', ') : '—'} · ${trip.blocked_count} blocked · majority ${trip.majority} of ${trip.members.length}</span>
    <b>Calls</b><span>${trip.events.filter(e => e.priority === 'P0').length} placed — P0 only: a phone-only stay, a late arrival there, or a member who didn't answer a disruption text</span>`;

  $('plans').innerHTML = trip.plans.length ? `<div class="h3">Plans (each member's all-in · their ceiling)</div><table><tr><th>v</th><th>Stay</th>${trip.members.map(x=>'<th>'+first(x)+'<br><small>≤ '+inr(trip.ceilings[x.id])+'</small></th>').join('')}<th>Total</th></tr>` +
    trip.plans.map(p => `<tr><td class="${p===plan?'current':''}">v${p.version}${p.note ? '<br><small>'+esc(p.note)+'</small>' : ''}</td><td>${p.stays.map(s => `${esc(s.name)}<br><small>${s.nights}n · ${inr(s.rate_per_room_night)}/room · ${Math.ceil(trip.heads[p.id]/2)} twin rooms for ${trip.heads[p.id]}${s.phone_only ? ' · phone-only' + (s.hold_until ? ', held till ' + fmt(s.hold_until) : '') : ' · listed'}${s.booking_ref ? ' · ' + s.booking_ref : ''}</small>`).join('<br>')}</td>${trip.members.map(x => { const v = trip.per_head[p.id][x.id], k = (p.parties || {})[x.id] || 1; return '<td' + (v != null && v > trip.ceilings[x.id] ? ' style="color:var(--red)"' : '') + '>' + (v != null ? inr(v) + (k > 1 ? `<br><small>×${k} = ${inr(trip.shares[p.id][x.id])}</small>` : '') : '—') + '</td>'; }).join('')}<td>${inr(trip.totals[p.id])}</td></tr>`).join('') + '</table>' : '';

  if (plan && (trip.state === 'VOTING' || Object.keys(trip.votes).length)) {
    const v = Object.values(trip.votes), yes = v.filter(x=>x.yes).length, no = v.length - yes;
    const pending = trip.state === 'VOTING' ? plan.travellers.length - v.length : 0;
    $('votes').innerHTML = `<div class="h3">Vote on v${plan.version} (private; the group sees only the tally)</div>${yes} yes · ${no} no${pending ? ` · ${pending} not yet` : ''}` +
      (no ? `<br><small>reasons for no: ${v.filter(x=>!x.yes).map(x=>esc(x.reason)||'—').join(' / ')}</small>` : '');
  } else $('votes').innerHTML = '';

  const auths = [...Object.values(trip.authorisations), ...Object.values(trip.top_ups)];
  const instr = {UPI_RESERVE: 'UPI Reserve Pay', UPI_OTM: 'UPI one-time mandate', CARD_PREAUTH: 'card hold'};
  $('auths').innerHTML = auths.length ? `<div class="h3">Blocks (UPI mandates and card holds)</div><table><tr><th>Member</th><th>Cap</th><th>Debited</th><th>Via</th><th>Status</th></tr>` +
    auths.map(a => `<tr><td>${first(member(a.member_id))}${a.purpose==='TOP_UP'?' <small>top-up</small>':''}</td><td>${inr(a.amount)}</td><td>${a.captured_amount ? inr(a.captured_amount) : '—'}</td><td><small>${a.instrument ? instr[a.instrument] + (a.emi_months ? ', ' + a.emi_months + '-mo EMI' : '') : 'member to choose'}<br>${a.rail_ref}</small></td><td><span class="pill ${a.status}">${a.status}</span></td></tr>`).join('') + '</table>' : '';

  const payouts = trip.payouts;
  $('auths').innerHTML += payouts.length ? `<div class="h3">Payouts from the pool</div><table><tr><th>Supplier</th><th>For</th><th>Ref</th><th>Amount</th><th>Via</th></tr>` +
    payouts.map(x => `<tr><td>${esc(x.supplier)}</td><td>${x.purpose.toLowerCase()}</td><td><small>${x.reference}</small></td><td>${inr(x.amount)}</td><td><small>${x.method.toLowerCase().replace('_',' ')}</small></td></tr>`).join('') + '</table>' : '';
  const riya = trip.members.find(x => first(x) === 'Riya') || trip.members[3];
  const failing = trip.knobs.fail_capture_for.includes(riya.id), drift = trip.knobs.drift.Delhi || 1;
  const next = drift < 1.02 ? 1.04 : drift < 1.5 ? 1.6 : 1.0;          // ×1.00 → ×1.04 → ×1.60 → ×1.00
  const nextLabel = {1.04: '×1.04 (moves inside the cap)', 1.6: '×1.60 (spikes past the cap)', 1: 'back to ×1.00'}[next];
  $('knobs').innerHTML = `<div class="h3">Demo knobs (the world, not the agent)</div>
    ${btn(`Fares from Delhi: ×${drift.toFixed(2)} → ${nextLabel}`, `knob('/rails/drift', {city: 'Delhi', multiplier: ${next}})`)}
    ${btn(failing ? `${first(riya)}'s debit will bounce — undo` : `Make ${first(riya)}'s debit bounce at booking`, `knob('/rails/fail-capture', {member_id: '${riya.id}', fail: ${!failing}})`, failing ? 'primary' : '')}`;

  $('rails').innerHTML = trip.events.filter(e => e.channel.startsWith('rail:')).map(e => `<div class="rail ${e.actor}"><span class="tag">${e.actor}</span>${e.priority === 'P0' ? '<span class="pill p0">P0 · call</span>' : ''}${esc(e.text)}</div>`).join('');
}
api('/clock').then(c => $('now').textContent = fmt(c.now));
</script>
</body>
</html>
